<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your stay · Ophir Stays</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
<style>

  .t-head{text-align:center;padding:36px 0 26px;border-bottom:1px solid var(--line)}
  .t-head svg{width:56px;height:56px;margin:0 auto 12px}
  .t-head .w{font-weight:500;letter-spacing:.5em;padding-left:.5em;font-size:22px}
  .t-head .s{font-weight:600;letter-spacing:.6em;padding-left:.6em;font-size:10px;color:var(--rust);margin-top:6px}
  .t-wrap{max-width:760px;margin:0 auto;padding:0 20px}
  .t-hero{text-align:center;padding:56px 0 40px}
  .t-meta{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:14px}
  .step{border-top:1px solid var(--line);padding:40px 0}
  .step h2{font-size:30px;margin:6px 0 6px}
  .step .sub{color:var(--muted);margin:0 0 24px}

  .state{text-align:center;padding:64px 0}
  .state svg{width:64px;height:64px;margin:0 auto 22px}
  .spin{width:36px;height:36px;border:2px solid var(--line);border-top-color:var(--rust);border-radius:50%;margin:0 auto 22px;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .u-hero{position:relative;margin:0 0 8px}
  .u-hero img{display:block;width:100%;height:340px;object-fit:cover}
  .u-intro{text-align:center;padding:44px 0 8px}
  .u-intro h1{font-size:44px;margin:8px 0 16px}
  .u-intro .lead{max-width:560px;margin:0 auto}
  .u-sec{padding:44px 0 0}
  .u-sec>h2{text-align:center;font-size:32px;margin:6px 0 26px}
  .u-sec>.eyebrow{text-align:center}
  .pk{background:#fff;border:1px solid var(--line);margin:0 0 26px;scroll-margin-top:24px;transition:box-shadow .3s}
  .pk.hl,.ad.hl{box-shadow:0 0 0 2px var(--rust)}
  .pk img{display:block;width:100%;height:240px;object-fit:cover}
  .pk .in{padding:30px 32px 32px}
  .pk h3{font-family:var(--serif);font-weight:500;font-size:27px;margin:4px 0 10px;line-height:1.2}
  .pk .pr{margin:4px 0 18px}.pk .pr b{font-family:var(--serif);font-weight:500;font-size:36px}.pk .pr span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-left:8px}
  .pk ul{list-style:none;padding:0;margin:0 0 6px}.pk li{padding:0 0 9px 26px;position:relative;font-size:16px}.pk li:before{content:"\2014";position:absolute;left:0;color:var(--rust)}
  .pk .btn,.ad .btn{margin-top:16px}
  .ads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .ad{background:#fff;border:1px solid var(--line);padding:22px 22px 20px;display:flex;flex-direction:column;scroll-margin-top:24px}
  .ad h4{font-family:var(--serif);font-weight:500;font-size:20px;margin:0 0 6px}
  .ad p{margin:0;color:var(--muted);font-size:15px;flex:1}
  .ad .pr{font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-top:12px}
  .ad .btn{align-self:flex-start;height:44px;padding:0 18px;font-size:12px}
  .done{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--rust);margin-top:14px}
  .note{max-width:560px;margin:34px auto 0;text-align:center;font-size:13px;color:var(--muted);line-height:1.6}
  .host{display:flex;gap:18px;align-items:center;background:var(--charcoal);color:#ECE4D3;padding:26px 28px;margin:40px 0 0}
  .host img{width:68px;height:68px;border-radius:50%;object-fit:cover;flex:none}
  .host p{margin:0;font-family:var(--serif);font-size:17px;line-height:1.55}
  .host small{display:block;margin-top:10px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#C99A7A}
  @media (max-width:640px){.ads{grid-template-columns:1fr}.u-intro h1{font-size:34px}.u-hero img{height:220px}.pk img{height:190px}.pk .in{padding:24px 22px 26px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="summit" viewBox="40 40 320 320"><circle cx="200" cy="200" r="150" fill="#2A2826"/><path d="M200 88 C213 140 225 198 248 246 C260 270 284 284 312 276 C292 300 250 304 226 290 C213 282 205 268 200 250 C195 268 187 282 174 290 C150 304 108 300 88 276 C116 284 140 270 152 246 C175 198 187 140 200 88 Z" fill="#ECE4D3"/></symbol></defs></svg>
<header class="t-head"><svg aria-hidden="true"><use href="#summit"/></svg><div class="w">OPHIR</div><div class="s">STAYS</div></header>
<main id="main" class="t-wrap">
  <div id="app"><div class="state"><div class="spin" aria-hidden="true"></div><p>Opening your stay…</p></div></div>
</main>
<script>
(function(){
  var token=(location.pathname.split('/upgrade/')[1]||'').replace(/[^a-f0-9]/g,'');
  var want=(new URLSearchParams(location.search).get('add')||'').replace(/[^a-z_]/g,'');
  var app=document.getElementById('app');
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var fmt=function(d,o){return new Date(d+'T12:00:00').toLocaleDateString('en-US',o||{month:'short',day:'numeric'})};
  var usd=function(c){return '$'+(c/100).toLocaleString('en-US',{maximumFractionDigits:0})};
  function fail(m){app.innerHTML='<div class="state"><p>'+esc(m)+'</p></div>'}
  if(!token) return fail('This link is not complete. Please use the link in your email.');
  fetch('/api/trip?t='+token).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Not found');return j})}).then(render).catch(function(e){fail(e.message)});
  function render(d){
    var m=new Date(d.check_in+'T12:00:00').getMonth(), snow=m>=10||m<=3, guests=d.adults+d.children;
    var pk=d.menu.filter(function(x){return x.kind==='package'}), ad=d.menu.filter(function(x){return x.kind==='addon'});
    var ITEMS={arranged:[snow?'Skis and boots sized to each guest, waiting in the gear room':'Bikes fitted to each rider and delivered to the house',snow?'Lift tickets, lessons and guides booked':'Guides, rafting and fly fishing booked','Dinner reservations held, first round on the house at our partner restaurants','A planning call, then every day built around the forecast','Two Ophir tumblers to keep'],
      private:['Everything in The Arranged Stay','Your own host, on call for the whole stay','Groceries shopped and the fridge stocked to your list','Fire laid, wine chosen, music on when you walk in','Private chef, in-home massage or a sitter booked for you','Airport transfer booked, and a mid-stay refresh']};
    function card(x){var p=x.key==='private';var unit=p?(d.package==='arranged'?'upgrade, Arranged Stay credited':'per stay'+(d.nights>5?', '+d.nights+' nights':', up to five nights')):'per stay, '+guests+' guests';
      return '<article class="pk" id="k-'+x.key+'"><img src="/assets/email/'+(p?'upgrade-private':(snow?'upgrade-ski':'upgrade-bike'))+'.jpg" alt=""><div class="in"><p class="eyebrow">'+(p?'The Private Stay':'The Arranged Stay')+'</p><h3>'+(p?'A dedicated host. Nothing left for you to do.':'Tell us what you love. We plan the trip around it.')+'</h3><div class="pr"><b>'+usd(x.cents)+'</b><span>'+unit+'</span></div><ul>'+ITEMS[x.key].map(function(i){return '<li>'+esc(i)+'</li>'}).join('')+'</ul><button class="btn '+(p?'':'btn-rust')+'" data-pay="'+x.key+'">'+(p?'Reserve your host':'Arrange my trip')+'</button></div></article>'}
    function addon(x){return '<div class="ad" id="k-'+x.key+'"><h4>'+esc(x.title)+'</h4><p>'+esc(x.blurb)+'</p><div class="pr">'+esc(x.price)+'</div><button class="btn" data-pay="'+x.key+'">Add to my stay</button></div>'}
    var first=String(d.guest_first||'').trim();
    app.innerHTML='<div class="u-hero"><img src="/assets/email/upgrade-hero.jpg" alt="A great room with the fire lit, ready for arrival"></div>'+
      '<section class="u-intro"><p class="eyebrow">'+esc(d.home?d.home.name:'Your stay')+' · '+fmt(d.check_in)+' to '+fmt(d.check_out,{month:'short',day:'numeric',year:'numeric'})+'</p><h1 class="display">'+(first?esc(first)+', the trip is ours to handle.':'The trip is ours to handle.')+'</h1><hr class="rule"><p class="lead">'+(d.package==='private'?'Your Private Stay is set. A few last touches, if you want them.':'Choose a package, add a single touch, or simply arrive. You can add to your stay any time before you arrive.')+'</p></section>'+
      (pk.length?'<section class="u-sec"><p class="eyebrow">Packages</p><h2 class="display">Choose how much we handle.</h2>'+pk.map(card).join('')+'</section>':'')+
      (ad.length?'<section class="u-sec"><p class="eyebrow">A la carte</p><h2 class="display">Or add a single touch.</h2><div class="ads">'+ad.map(addon).join('')+'</div></section>':'')+
      (!d.menu.length?'<section class="u-intro"><p class="lead">Everything we offer is already part of your stay. We will see you soon.</p></section>':'')+
      '<div class="host"><img src="/assets/email/casey-lake.jpg" alt="Casey Roberts"><p>I have lived in Durango for twenty-three years. Tell me what you love and I will build the days around it, the way I would for my own family.<small>Casey Roberts · Founder</small></p></div>'+
      '<p class="note">Package prices cover our planning, booking and hosting. Rentals, lift tickets, guides, chefs and groceries are paid separately at our partners\u2019 rates, with no markup. Early check-in and late checkout are confirmed within a day, or refunded in full.</p>'+
      '<p class="note" style="margin-top:14px"><a href="/trip/'+token+'">Go to your trip page</a></p><div style="height:60px"></div>';
    app.querySelectorAll('[data-pay]').forEach(function(b){b.onclick=async function(){var lbl=b.textContent;b.disabled=true;b.textContent='Opening checkout…';
      try{var r=await fetch('/api/checkout?t='+token,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:b.dataset.pay})});var j=await r.json();if(!r.ok||!j.url)throw new Error(j.error||'Checkout could not start');location.href=j.url}
      catch(e){b.disabled=false;b.textContent=lbl;var n=b.parentNode.querySelector('.done');if(!n){n=document.createElement('p');n.className='done';b.parentNode.appendChild(n)}n.textContent=e.message}}});
    if(want){var el=document.getElementById('k-'+want);if(el){el.classList.add('hl');setTimeout(function(){el.scrollIntoView({behavior:'smooth',block:'start'})},300)}}
  }
})();
</script>
</body>
</html>
