<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ophir · Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
<style>
  body{background:var(--paper)}
  .a-top{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line);background:#fff}
  .a-top b{letter-spacing:.4em;font-weight:600}
  .a-wrap{max-width:1240px;margin:0 auto;padding:28px 24px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;align-items:start}
  .panel{background:#fff;border:1px solid var(--line);padding:22px}
  .panel h2{font-size:22px;font-weight:500;margin:0 0 14px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
  .row:hover b{color:var(--rust)}
  .row small{color:var(--muted)}
  .pill{font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--line);white-space:nowrap;align-self:flex-start}
  .pill.plan_ready{border-color:var(--rust);color:var(--rust)}
  .pill.approved{background:var(--charcoal);color:#fff;border-color:var(--charcoal)}
  .tools{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:6px}
  .tools .field{min-width:140px}
  .btn.sm{height:42px;padding:0 16px;font-size:12px}
  .task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
  .task input{width:20px;height:20px;margin-top:2px;accent-color:#B4572B}
  .task small{display:block;color:var(--muted)}
  .kv{display:grid;grid-template-columns:140px 1fr;gap:6px 14px;font-size:15px}
  .kv span:nth-child(odd){color:var(--muted)}
  .it{padding:8px 0;border-top:1px solid var(--line);font-size:15px}
  .it i{color:var(--rust);font-family:var(--serif)}
  .note{background:var(--paper);padding:14px;font-size:15px;white-space:pre-wrap}
  .msg{font-size:14px;color:var(--muted)}
  @media (max-width:900px){.a-wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="a-top"><b>OPHIR · ADMIN</b><button class="btn sm" id="out" hidden>Sign out</button></div>
<div id="login" class="t-wrap" style="max-width:380px;margin:80px auto;padding:0 20px">
  <form id="lf" class="panel"><h2>Sign in</h2><div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div><p class="msg" id="lm"></p><button class="btn btn-rust" style="width:100%;margin-top:12px">Enter</button></form>
</div>
<div class="a-wrap" id="main" hidden>
  <div>
    <div class="panel" style="margin-bottom:24px">
      <h2>Test a booking</h2>
      <div class="tools">
        <div class="field"><label for="pk">Package</label><select id="pk"><option value="arranged">Arranged</option><option value="private">Private</option><option value="stay">Stay</option></select></div>
        <div class="field"><label for="dd">Arrives in</label><select id="dd"><option value="5">5 days</option><option value="10" selected>10 days</option><option value="30">30 days</option><option value="60">60 days</option></select></div>
        <button class="btn btn-rust sm" id="sim">Simulate booking</button>
      </div>
      <p class="msg" id="sm">Creates a fake Airbnb-style booking. The welcome email goes to your inbox.</p>
    </div>
    <div class="panel" style="margin-bottom:24px"><h2>Trips</h2><div id="trips"><p class="msg">Loading…</p></div></div>
    <div class="panel"><h2>Team to-do</h2><div id="tasks"></div></div>
  </div>
  <div class="panel" id="detail"><p class="msg">Select a trip.</p></div>
</div>
<script>
(function(){
  var KEY='ophir-admin', pw=''; try{pw=sessionStorage.getItem(KEY)||''}catch(e){}
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var d=function(x,o){return x?new Date(x.length>10?x:x+'T12:00:00').toLocaleString('en-US',o||{month:'short',day:'numeric'}):''};
  async function api(body){var r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':pw},body:JSON.stringify(body)});var j=await r.json().catch(function(){return{}});if(r.status===401){signout();throw new Error('Wrong password')}if(!r.ok)throw new Error(j.error||'Error');return j}
  function signout(){pw='';try{sessionStorage.removeItem(KEY)}catch(e){}document.getElementById('main').hidden=true;document.getElementById('out').hidden=true;document.getElementById('login').hidden=false}
  document.getElementById('out').onclick=signout;
  document.getElementById('lf').onsubmit=async function(e){e.preventDefault();pw=document.getElementById('pw').value;try{await list();try{sessionStorage.setItem(KEY,pw)}catch(e){}show()}catch(err){document.getElementById('lm').textContent=err.message}};
  function show(){document.getElementById('login').hidden=true;document.getElementById('main').hidden=false;document.getElementById('out').hidden=false}
  var tripsById={};
  async function list(){var j=await api({action:'list'});tripsById={};j.trips.forEach(function(t){tripsById[t.id]=t});
    document.getElementById('trips').innerHTML=j.trips.length?j.trips.map(function(t){return '<div class="row" data-id="'+t.id+'"><div><b>'+esc(t.guest_name)+'</b><br><small>'+d(t.check_in)+'–'+d(t.check_out)+' · '+esc(t.homes?t.homes.name:'')+' · '+esc(t.package)+' · '+esc(t.source)+'</small></div><span class="pill '+esc(t.status)+'">'+esc(t.status.replace('_',' '))+'</span></div>'}).join(''):'<p class="msg">No trips yet. Simulate a booking.</p>';
    document.getElementById('tasks').innerHTML=j.tasks.length?j.tasks.map(taskRow).join(''):'<p class="msg">Nothing open.</p>';}
  function taskRow(k){var t=tripsById[k.trip_id];return '<label class="task"><input type="checkbox" data-task="'+k.id+'"><span>'+esc(k.title)+'<small>'+esc(k.assignee||'')+(k.due_at?' · due '+d(k.due_at,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'')+(t?' · '+esc(t.guest_name):'')+(k.approved?'':' · awaiting approval')+'</small></span></label>'}
  document.getElementById('trips').onclick=function(e){var r=e.target.closest('.row');if(r)detail(r.dataset.id)};
  document.addEventListener('change',async function(e){var id=e.target.dataset&&e.target.dataset.task;if(!id)return;await api({action:'task',id:id,status:e.target.checked?'done':'open'});e.target.closest('.task').style.opacity=e.target.checked?.4:1});
  document.getElementById('sim').onclick=async function(){var m=document.getElementById('sm');m.textContent='Creating booking and writing the welcome email…';try{var j=await api({action:'simulate',package:document.getElementById('pk').value,days_out:document.getElementById('dd').value});m.innerHTML='Done. Check your inbox, or <a href="'+j.link+'" target="_blank">open the guest page</a>.';await list();detail(j.id)}catch(err){m.textContent=err.message}};
  async function detail(id){var el=document.getElementById('detail');el.innerHTML='<p class="msg">Loading…</p>';
    try{var j=await api({action:'detail',id:id}),t=j.trip,a=j.answers||{};var days={};j.itinerary.forEach(function(i){(days[i.day]=days[i.day]||[]).push(i)});
    var summary=(j.messages.find(function(m){return m.subject==='Plan summary'})||{}).body;
    el.innerHTML='<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><h2 style="margin:0">'+esc(t.guest_name)+'</h2><p class="msg">'+esc(j.home?j.home.name:'')+' · '+d(t.check_in,{weekday:'short',month:'short',day:'numeric'})+' – '+d(t.check_out,{weekday:'short',month:'short',day:'numeric'})+' · '+t.adults+' adults, '+t.children+' children · '+esc(t.package)+'</p></div><span class="pill '+esc(t.status)+'">'+esc(t.status.replace('_',' '))+'</span></div>'+
      '<div class="tools" style="margin:14px 0 20px">'+(t.status==='plan_ready'?'<button class="btn btn-rust sm" data-act="approve">Approve and send to guest</button>':'')+((a&&a.trip_id)||j.party.length?'<button class="btn sm" data-act="replan">Re-plan with AI</button>':'')+'<a class="btn sm" href="'+j.link+'" target="_blank">Guest page</a><button class="btn sm" data-act="resend_welcome">Resend welcome</button></div>'+
      (summary?'<p class="eyebrow">AI summary</p><div class="note">'+esc(summary)+'</div>':'')+
      '<p class="eyebrow" style="margin-top:22px">Party</p>'+(j.party.length?j.party.map(function(p){return '<div class="it"><b>'+esc(p.name)+'</b> · '+esc(p.age_group||'')+(p.height_cm?' · '+Math.floor(p.height_cm/30.48)+'′'+Math.round((p.height_cm/2.54)%12)+'″':'')+(p.boot_size?' · boot '+esc(p.boot_size):'')+(p.weight_kg?' · '+Math.round(p.weight_kg*2.205)+' lb':'')+(p.ski_level?' · ski: '+esc(p.ski_level):'')+(p.bike_level?' · bike: '+esc(p.bike_level):'')+'</div>'}).join(''):'<p class="msg">Waiting on the guest’s answers.</p>')+
      (j.answers?'<p class="eyebrow" style="margin-top:22px">Answers</p><div class="kv"><span>Interests</span><span>'+esc((a.interests||[]).join(', '))+'</span><span>Pace</span><span>'+esc(a.pace)+'</span><span>Arrival</span><span>'+esc(a.arrival_time)+'</span><span>Coffee</span><span>'+esc(a.coffee)+'</span><span>Groceries</span><span>'+esc(a.groceries)+'</span><span>Dietary</span><span>'+esc(a.dietary)+'</span><span>Celebrating</span><span>'+esc(a.celebrations)+'</span><span>Notes</span><span>'+esc(a.notes)+'</span></div>':'')+
      (j.itinerary.length?'<p class="eyebrow" style="margin-top:22px">Itinerary</p>'+Object.keys(days).sort().map(function(k){return '<div style="margin-bottom:10px"><b>'+d(k,{weekday:'long',month:'short',day:'numeric'})+'</b>'+days[k].map(function(i){return '<div class="it"><i>'+esc(i.start_time||'')+'</i> '+esc(i.title)+(i.weather_note?' <small style="color:var(--rust)">· '+esc(i.weather_note)+'</small>':'')+'<br><small style="color:var(--muted)">'+esc(i.details||'')+'</small></div>'}).join('')+'</div>'}).join(''):'')+
      (j.tasks.length?'<p class="eyebrow" style="margin-top:22px">Tasks for this trip</p>'+j.tasks.map(taskRow).join(''):'');
    el.querySelectorAll('[data-act]').forEach(function(b){b.onclick=async function(){var lbl=b.textContent;b.disabled=true;b.textContent='Working…';try{await api({action:b.dataset.act,id:id});await list();detail(id)}catch(err){alertMsg(err.message);b.disabled=false;b.textContent=lbl}}});
    }catch(err){el.innerHTML='<p class="err">'+esc(err.message)+'</p>'}}
  function alertMsg(m){var el=document.getElementById('detail');el.insertAdjacentHTML('afterbegin','<p class="err" role="alert">'+esc(m)+'</p>')}
  if(pw){list().then(show).catch(signout)}
})();
</script>
</body>
</html>
